<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💝</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: manipulation; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            position: relative;
            min-height: 550px;
            transition: all 0.5s ease;
        }

        .hidden { display: none !important; }

        h1 { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: #d63384; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        
        .input-wrapper { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; color: #444; margin-bottom: 8px; font-size: 0.9rem; }
        
        /* Fixed Phone Styling */
        .phone-container { display: flex; align-items: center; background: #fff; border: 2px solid #ff99cc; border-radius: 15px; padding: 0 15px; }
        .prefix { font-weight: bold; color: #d63384; border-right: 1px solid #ccc; padding-right: 10px; }
        .phone-container input { border: none !important; padding: 12px 10px; width: 100%; font-size: 1rem; outline: none; }

        input[type="text"] {
            width: 100%; padding: 12px 20px; border: 2px solid #ff99cc; border-radius: 15px; font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #d63384; box-shadow: 0 0 10px rgba(214, 51, 132, 0.2); }

        .btn {
            padding: 15px 35px; border-radius: 50px; border: none; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn-main { background: linear-gradient(135deg, #ff0066, #ff6699); color: white; width: 100%; justify-content: center; }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 0, 102, 0.3); }

        /* Response Logic */
        .btn-yes { background: #28a745; color: white; z-index: 100; position: relative; }
        .btn-no { background: #dc3545; color: white; position: absolute; z-index: 50; transition: none; }

        /* Floating Hearts */
        .heart { position: absolute; color: rgba(255, 255, 255, 0.5); pointer-events: none; animation: float 6s linear infinite; z-index: -1; }
        @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

        /* Ads */
        .ad-popup {
            position: fixed; bottom: 20px; left: 20px; background: white; border-radius: 20px;
            padding: 20px; border: 3px solid #d63384; z-index: 1000; display: none;
            max-width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }
        .close-ad { position: absolute; top: 5px; right: 10px; cursor: pointer; font-size: 1.2rem; }

        .stat-badge { background: #fce4ec; color: #d81b60; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin: 5px; display: inline-block; }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="panel" id="creator-box">
        <h1>Create Love</h1>
        <p style="margin-bottom: 25px; color: #666;">Craft a magical proposal link!</p>
        
        <div class="input-wrapper">
            <label>Your Name</label>
            <input type="text" id="c-name" placeholder="Enter your name">
        </div>
        
        <div class="input-wrapper">
            <label>Valentine's Name</label>
            <input type="text" id="v-name" placeholder="Enter their name">
        </div>

        <div class="input-wrapper">
            <label>WhatsApp Number (to receive response)</label>
            <div class="phone-container">
                <span class="prefix">+91</span>
                <input type="text" id="c-phone" placeholder="XXXXX XXXXX" maxlength="11">
            </div>
        </div>

        <button class="btn btn-main" onclick="generateLink()">Create Magical Link <i class="fas fa-sparkles"></i></button>
    </div>

    <div class="panel hidden" id="share-box">
        <h1>Link Ready! 💌</h1>
        <p>Send this to <span id="span-v-name" style="color:#d63384; font-weight:bold;"></span></p>
        <div id="link-url" style="background:#f8f9fa; padding:15px; border-radius:15px; margin:20px 0; font-size:0.8rem; border:1px dashed #d63384; word-break:break-all;"></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-main" style="background:#007bff;" onclick="copyLink()">Copy <i class="fas fa-copy"></i></button>
            <button class="btn btn-main" style="background:#25D366;" onclick="shareWA()">WhatsApp <i class="fab fa-whatsapp"></i></button>
        </div>
    </div>

    <div class="panel hidden" id="response-box">
        <h1 id="v-header">Will You?</h1>
        <p id="v-subtext" style="font-size: 1.2rem; color: #555;"></p>
        
        <div id="game-area" style="height: 250px; position: relative; margin-top: 30px; display: flex; align-items: center; justify-content: center; gap: 40px;">
            <button class="btn btn-yes" onclick="sayYes()">YES! ❤️</button>
            <button class="btn btn-no" id="no-btn">No</button>
        </div>
        
        <div id="no-counter" class="stat-badge">Attempts to say No: 0</div>
    </div>

    <div class="panel hidden" id="success-box">
        <h1>Accepted! 💖</h1>
        <p>You've made me very happy today!</p>
        <div id="final-stats" style="margin: 20px 0;"></div>
        <button class="btn btn-main" style="background:#25D366" onclick="confirmPartner()">Confirm to Partner <i class="fab fa-whatsapp"></i></button>
    </div>

    <div id="ad-box" class="ad-popup">
        <span class="close-ad" onclick="closeAd()">×</span>
        <h3 style="color:#d63384; font-size:1rem; margin-bottom:5px;">Valentine's Hunger?</h3>
        <p style="font-size:0.8rem; color:#666;">Treat your Valentine to EasyGo's best Momos! Use Zomato.</p>
        <a href="https://zomato.com" target="_blank" style="color:#d63384; font-size:0.8rem; font-weight:bold;">View Menu</a>
    </div>

    <script>
        let noCount = 0;
        let speed = 0.5;
        let pData = {};
        let startTime = null;

        // --- PHONE INPUT LOCK ---
        document.getElementById('c-phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // --- BACKGROUND HEARTS ---
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('i');
            heart.classList.add('fas', 'fa-heart', 'heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHearts, 300);

        // --- CORE FUNCTIONS ---
        function generateLink() {
            const name = document.getElementById('c-name').value;
            const vName = document.getElementById('v-name').value;
            const phone = document.getElementById('c-phone').value;

            if(!name || !vName || phone.length !== 10) return alert("Enter valid names and a 10-digit number!");

            pData = { n: name, v: vName, p: "91"+phone };
            const encoded = btoa(JSON.stringify(pData));
            const url = window.location.origin + window.location.pathname + "?q=" + encoded;

            document.getElementById('link-url').innerText = url;
            document.getElementById('span-v-name').innerText = vName;
            document.getElementById('creator-box').classList.add('hidden');
            document.getElementById('share-box').classList.remove('hidden');

            if(Math.random() > 0.6) showAd();
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('link-url').innerText);
            alert("Link Copied!");
        }

        function shareWA() {
            const link = document.getElementById('link-url').innerText;
            window.open(`https://wa.me/?text=Hey! I have a special question for you: ${encodeURIComponent(link)}`, '_blank');
        }

        // --- NO BUTTON ESCAPE ---
        const noBtn = document.getElementById('no-btn');
        const box = document.getElementById('response-box');

        function moveNo() {
            const bRect = box.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            const maxX = bRect.width - btnRect.width - 40;
            const maxY = bRect.height - btnRect.height - 100;

            const x = Math.random() * maxX + 20;
            const y = Math.random() * maxY + 20;

            noBtn.style.transition = `all ${speed}s ease`;
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        noBtn.addEventListener('mouseover', moveNo);
        noBtn.addEventListener('click', () => {
            noCount++;
            speed = Math.max(0.1, speed - 0.05);
            document.getElementById('no-counter').innerText = `Attempts to say No: ${noCount}`;
            moveNo();
        });

        function sayYes() {
            const duration = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('response-box').classList.add('hidden');
            document.getElementById('success-box').classList.remove('hidden');
            document.getElementById('final-stats').innerHTML = `
                <div class="stat-badge">No Missed: ${noCount}</div>
                <div class="stat-badge">Think Time: ${duration}s</div>
            `;
            showAd();
        }

        function confirmPartner() {
            const text = `YES! I accept your Valentine's proposal! ❤️ (I missed the No button ${noCount} times!)`;
            window.open(`https://wa.me/${pData.p}?text=${encodeURIComponent(text)}`, '_blank');
        }

        function showAd() { document.getElementById('ad-box').style.display = 'block'; }
        function closeAd() { document.getElementById('ad-box').style.display = 'none'; }

        // --- LOAD ---
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if(q) {
                pData = JSON.parse(atob(q));
                document.getElementById('creator-box').classList.add('hidden');
                document.getElementById('response-box').classList.remove('hidden');
                document.getElementById('v-header').innerText = `Hey ${pData.v}!`;
                document.getElementById('v-subtext').innerText = `${pData.n} is waiting for your answer...`;
                startTime = Date.now();
                moveNo();
            }
        };
    </script>
</body>
</html>
