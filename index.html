<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Valentine? 💝</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: manipulation; }
        :root { --base-font-size: 16px; }
        html { font-size: var(--base-font-size); }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem; overflow: hidden; position: relative;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .heart-particle { position: absolute; color: rgba(255, 255, 255, 0.6); pointer-events: none; animation: floatUp 6s linear infinite; z-index: 1; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }

        .panel {
            background-color: rgba(255, 255, 255, 0.98);
            border-radius: 1.5625rem; padding: 2rem 1rem;
            box-shadow: 0 1.25rem 3.125rem rgba(153, 0, 77, 0.3);
            border: 0.3125rem solid #ff99cc;
            width: 100%; max-width: 500px; text-align: center; position: relative; z-index: 10;
            min-height: 580px; display: flex; flex-direction: column; justify-content: center;
            overflow: hidden; /* Strict containment */
        }
        .hidden { display: none !important; }
        h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.2rem, 8vw, 3.5rem); color: #ff0066; margin-bottom: 1rem; }
        
        .input-group { margin: 0.8rem 0; text-align: left; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 700; color: #660033; font-size: 0.9rem; }
        .phone-container { display: flex; align-items: center; background: #fff; border: 0.1875rem solid #ff99cc; border-radius: 0.9375rem; padding: 0 1rem; }
        .prefix { font-weight: 800; color: #ff0066; border-right: 2px solid #ff99cc; padding-right: 10px; margin-right: 10px; }
        input { width: 100%; padding: 0.8rem; border: 0.1875rem solid #ff99cc; border-radius: 0.9375rem; font-size: 1rem; outline: none; }
        .phone-container input { border: none !important; }

        .btn {
            padding: 1rem 2rem; font-size: 1.2rem; font-weight: 700; border: none; border-radius: 3.75rem;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0.75rem 1.5625rem rgba(0, 0, 0, 0.2);
            display: inline-flex; align-items: center; gap: 0.5rem;
            z-index: 100;
        }
        .btn-main { background: linear-gradient(135deg, #660033, #99004d); color: white; width: 100%; }
        .btn-yes { background: linear-gradient(135deg, #ff0066, #ff3385); color: white; position: relative; }
        .btn-no { background: linear-gradient(135deg, #cccccc, #999999); color: #33001a; position: absolute; white-space: nowrap; }

        #question-text { font-size: 1.5rem; font-family: 'Dancing Script', cursive; color: #ff0066; min-height: 80px; margin-bottom: 5px; padding: 0 10px; }
        .status-msg { color: #cc0066; font-weight: 600; font-size: 0.85rem; margin-top: 5px; min-height: 25px; padding: 0 10px; }
        
        .upload-hint { font-size: 0.7rem; color: #99004d; margin-top: 5px; text-decoration: none; display: block; text-align: left; }
    </style>
</head>
<body onclick="autoPlayMusic()">

    <div id="hearts-container"></div>
    <audio id="bg-music" loop><source src="https://raw.githubusercontent.com/Clean-Scripts/valentine/main/song.mp3" type="audio/mpeg"></audio>

    <div class="container">
        <div class="panel" id="creator-box">
            <h1>Create Proposal 💖</h1>
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="c-name" placeholder="Enter your Name">
            </div>
            <div class="input-group">
                <label>Valentine's Name</label>
                <input type="text" id="v-name" placeholder="Enter your Valentine's name">
            </div>
            
            <div class="input-group">
                <label>Upload Clip/Image (Max 5MB)</label>
                <input type="file" id="media-upload" accept="image/*,video/*" onchange="validateFile(this)">
                <a href="https://github.com/Clean-Scripts/valentine/upload/main" target="_blank" class="upload-hint">Upload here & commit</a>
            </div>

            <div class="input-group">
                <label>Your WhatsApp [To get Reply]</label>
                <div class="phone-container">
                    <span class="prefix">+91</span>
                    <input type="tel" id="c-phone" placeholder="XXXXX XXXXX" maxlength="10">
                </div>
            </div>
            <button class="btn btn-main" onclick="generateLink()">Create Link ✨</button>
        </div>

        <div class="panel hidden" id="response-box">
            <h1 id="v-header">A Special Message... 🌹</h1>
            <div id="question-text">Will you be my Valentine? ❤️</div>
            <div class="status-msg" id="status-msg"></div>
            
            <div id="game-area" style="height: 350px; position: relative; width: 100%;">
                <button class="btn btn-yes" id="yes-btn" onclick="checkYes()">YES! ❤️</button>
                <button class="btn btn-no" id="no-btn">No 😭</button>
            </div>
            <div id="no-counter" style="font-size: 0.8rem; color: #ff0066; font-weight: bold;">Misses: 0</div>
        </div>

        <div class="panel hidden" id="success-box">
            <h1>UFF! Finally! 🥰💍</h1>
            <p id="final-msg" style="font-size: 1.1rem; margin: 1rem 0; font-style: italic; color: #ff0066;"></p>
            <button class="btn btn-main" style="background:#25D366" onclick="confirmPartner()">Tell them YES! <i class="fab fa-whatsapp"></i></button>
        </div>
    </div>

    <script>
        let noCount = 0;
        let speed = 0.4;
        let pData = {};
        let musicStarted = false;
        const music = document.getElementById('bg-music');

        const questionsList = ["Are you sure? 💔", "Pehle manaao toh sahi! 🙄", "Don't be so boring! 😂", "Really? No? 😭", "I'll keep asking! 😋", "Wait! Think again! 😍", "Almost caught it! 💨", "Do you believe in love at first sight?"];
        const fakeYesMessages = ["Itni jaldi? Thoda manaao toh sahi! 🙄💖", "Sirf ek click mein Haan? Try again! 😜", "Boring pati mat bano, thodi mehnat karo! 😂🔥", "Arre! Pehle No button toh pakad ke dikhao! 🏃‍♂️💨", "Almost there... but try once more! 😋💘"];

        function validateFile(input) {
            if (input.files[0] && input.files[0].size / 1024 / 1024 > 5) {
                alert("File size exceeds 5MB!");
                input.value = "";
            }
        }

        function createHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart heart-particle';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 350);

        function autoPlayMusic() { if (!musicStarted) { music.play().catch(()=>{}); musicStarted = true; } }

        function generateLink() {
            const n = document.getElementById('c-name').value;
            const v = document.getElementById('v-name').value;
            const p = document.getElementById('c-phone').value;
            if(!n || !v || p.length !== 10) return alert("Fill everything!");
            pData = { n, v, p: "91" + p };
            const url = window.location.origin + window.location.pathname + "?q=" + btoa(encodeURIComponent(JSON.stringify(pData)));
            // In real use, you'd show a share box here
            window.location.search = "q=" + btoa(encodeURIComponent(JSON.stringify(pData)));
        }

        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const panel = document.querySelector('.panel');

        function moveBtn(btn) {
            const pRect = panel.getBoundingClientRect();
            const bRect = btn.getBoundingClientRect();
            
            // Boundary limit: Panel width/height minus button size and border padding
            const padding = 20;
            const maxX = pRect.width - bRect.width - padding;
            const maxY = pRect.height - bRect.height - padding;

            // Random coordinates strictly inside the white panel
            const x = Math.max(padding, Math.random() * maxX);
            const y = Math.max(padding, Math.random() * maxY);

            btn.style.position = "absolute";
            btn.style.transition = `all ${speed}s ease-out`;
            btn.style.left = x + "px"; 
            btn.style.top = y + "px";
        }

        function handleNoInteraction(e) {
            if(e) e.preventDefault();
            noCount++;
            speed = Math.max(0.1, speed - 0.05);
            document.getElementById('no-counter').innerText = `Misses: ${noCount}`;
            document.getElementById('question-text').innerText = questionsList[noCount % questionsList.length];
            moveBtn(noBtn);
        }

        noBtn.addEventListener('mouseover', () => moveBtn(noBtn));
        noBtn.addEventListener('touchstart', handleNoInteraction);
        noBtn.addEventListener('click', handleNoInteraction);

        function checkYes() {
            if (noCount < 15) {
                // Yes button only moves inside the panel on mobile
                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) moveBtn(yesBtn);
                const randomIndex = Math.floor(Math.random() * fakeYesMessages.length);
                document.getElementById('status-msg').innerText = fakeYesMessages[randomIndex];
                moveBtn(noBtn);
                return;
            }
            sayYes();
        }

        function sayYes() {
            confetti({ particleCount: 300, spread: 90, origin: { y: 0.6 } });
            document.getElementById('response-box').classList.add('hidden');
            document.getElementById('success-box').classList.remove('hidden');
            document.getElementById('final-msg').innerText = `I knew you'd make a good choice, your heart is in the right place... ❤️✨`;
        }

        function confirmPartner() {
            const msg = `YESSS! I am your Valentine! ❤️ I missed it ${noCount} times! 😍💍`;
            window.open(`https://wa.me/${pData.p}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if(q) {
                try {
                    pData = JSON.parse(decodeURIComponent(atob(q)));
                    document.getElementById('creator-box').classList.add('hidden');
                    document.getElementById('response-box').classList.remove('hidden');
                    document.getElementById('v-header').innerText = `Hey ${pData.v}! ✨`;
                    // Reset to absolute within panel
                    noBtn.style.position = "absolute";
                    yesBtn.style.position = "absolute";
                    moveBtn(noBtn);
                    moveBtn(yesBtn);
                } catch(e) { console.error("Link error"); }
            }
        };
    </script>
</body>
</html>
