<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💝</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: manipulation; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(45deg, #ff0066, #ff99cc); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        .panel { background: rgba(255, 255, 255, 0.98); border-radius: 25px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 5px solid #ff99cc; position: relative; overflow: hidden; min-height: 500px; }
        .hidden { display: none !important; }
        h1 { font-family: 'Dancing Script', cursive; font-size: 3rem; color: #ff0066; margin-bottom: 20px; }
        p { color: #33001a; margin-bottom: 20px; }
        
        /* Form Styles */
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: 700; color: #660033; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #ff99cc; border-radius: 10px; font-family: inherit; }
        
        /* Button Styles */
        .btn { padding: 15px 30px; font-size: 1.2rem; font-weight: 700; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; }
        .btn-yes { background: #ff0066; color: white; box-shadow: 0 5px 15px rgba(255, 0, 102, 0.3); z-index: 10; position: relative; }
        .btn-no { background: #999; color: white; position: absolute; z-index: 5; white-space: nowrap; }
        .btn-generate { background: #660033; color: white; margin-top: 20px; }
        .btn-share { background: #25D366; color: white; margin-top: 10px; }

        /* No Button Wrapper Area */
        #main-buttons { position: relative; height: 200px; margin-top: 30px; display: flex; justify-content: center; align-items: center; }

        /* Ads */
        .ad-box { position: fixed; bottom: 20px; right: 20px; background: white; border: 3px solid #ff0066; padding: 15px; border-radius: 15px; z-index: 9999; max-width: 250px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .close-ad { position: absolute; top: -10px; right: -10px; background: #333; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
        
        /* Image Preview */
        .valentine-image { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #ff99cc; margin: 10px auto; display: block; }
        
        .share-link-box { background: #f0f0f0; padding: 15px; border-radius: 10px; word-break: break-all; margin: 20px 0; font-family: monospace; border: 1px dashed #660033; }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel" id="creator-screen">
            <h1>Create Proposal</h1>
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="c-name" placeholder="Nishant">
            </div>
            <div class="input-group">
                <label>Valentine's Name</label>
                <input type="text" id="v-name" placeholder="Name">
            </div>
            <div class="input-group">
                <label>Your WhatsApp (With Country Code)</label>
                <input type="tel" id="c-phone" placeholder="919999999999">
            </div>
            <button class="btn btn-generate" onclick="generateLink()">Generate Link <i class="fas fa-magic"></i></button>
        </div>

        <div class="panel hidden" id="share-screen">
            <h1>Ready to Send!</h1>
            <p>Copy the link or share directly to WhatsApp.</p>
            <div class="share-link-box" id="link-display"></div>
            <button class="btn" style="background:#3366ff; color:white;" onclick="copyLink()">Copy Link <i class="fas fa-copy"></i></button>
            <button class="btn btn-share" onclick="shareWhatsApp()">Share on WhatsApp <i class="fab fa-whatsapp"></i></button>
        </div>

        <div class="panel hidden" id="response-screen">
            <h1 id="v-title">Will You Be My Valentine?</h1>
            <div id="main-buttons">
                <button class="btn btn-yes" id="yes-btn" onclick="sayYes()">YES! ❤️</button>
                <button class="btn btn-no" id="no-btn">No</button>
            </div>
            <p id="no-msg" style="font-style: italic; margin-top: 10px; color: #ff0066;"></p>
        </div>

        <div class="panel hidden" id="success-screen">
            <h1>She/He Said YES! 💖</h1>
            <p>The universe is happy! Your response has been recorded.</p>
            <button class="btn btn-share" id="final-wa-btn">Send Confirmation to Partner</button>
        </div>
    </div>

    <div id="ad-box" class="ad-box">
        <button class="close-ad" onclick="closeAd()">×</button>
        <p><strong>Valentine's Special!</strong></p>
        <p style="font-size: 0.8rem;">Hungry? Get 30% off on Zomato for your first date!</p>
        <a href="https://zomato.com" target="_blank" style="color: #ff0066; font-size: 0.8rem;">Order Now</a>
    </div>

    <script>
        let noCount = 0;
        let speedMultiplier = 1;
        let proposalData = {};

        // --- 1. COORDINATION & NAVIGATION ---
        function generateLink() {
            const name = document.getElementById('c-name').value;
            const vName = document.getElementById('v-name').value;
            const phone = document.getElementById('c-phone').value;

            if(!name || !vName || !phone) return alert("Fill all details!");

            proposalData = { name, vName, phone, id: Date.now() };
            const encoded = btoa(JSON.stringify(proposalData));
            const url = window.location.origin + window.location.pathname + "?p=" + encoded;

            document.getElementById('link-display').innerText = url;
            document.getElementById('creator-screen').classList.add('hidden');
            document.getElementById('share-screen').classList.remove('hidden');
            
            // Random Ad Chance
            if(Math.random() > 0.5) showAd();
        }

        function copyLink() {
            const link = document.getElementById('link-display').innerText;
            navigator.clipboard.writeText(link);
            alert("Link Copied!");
        }

        function shareWhatsApp() {
            const link = document.getElementById('link-display').innerText;
            const text = `Hi! Someone has sent you a special Valentine's Proposal. Click here to see: ${link}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        // --- 2. THE ESCAPING NO BUTTON ---
        const noBtn = document.getElementById('no-btn');
        const panel = document.getElementById('response-screen');

        document.addEventListener('mousemove', (e) => {
            if (panel.classList.contains('hidden')) return;

            const rect = noBtn.getBoundingClientRect();
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            // Distance between mouse and button
            const dist = Math.sqrt(Math.pow(mouseX - (rect.left + rect.width/2), 2) + Math.pow(mouseY - (rect.top + rect.height/2), 2));

            // Trigger escape if mouse is within 150px
            if (dist < 150) {
                moveNo();
            }
        });

        function moveNo() {
            const pRect = panel.getBoundingClientRect();
            const bRect = noBtn.getBoundingClientRect();
            const yesBtnRect = document.getElementById('yes-btn').getBoundingClientRect();

            // Calculate safe boundaries (within the pink border)
            const maxX = pRect.width - bRect.width - 40;
            const maxY = pRect.height - bRect.height - 40;

            let newX, newY;
            let isOverlappingYes = true;

            // Ensure it doesn't hide behind the Yes button
            while(isOverlappingYes) {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;

                // Check overlap with Yes Button
                const yesRelX = yesBtnRect.left - pRect.left;
                const yesRelY = yesBtnRect.top - pRect.top;

                const overlap = !(newX + bRect.width < yesRelX || 
                                  newX > yesRelX + yesBtnRect.width || 
                                  newY + bRect.height < yesRelY || 
                                  newY > yesRelY + yesBtnRect.height);
                
                if (!overlap) isOverlappingYes = false;
            }

            // Apply position with increasing speed/difficulty
            noBtn.style.transition = `all ${0.3 / speedMultiplier}s ease-out`;
            noBtn.style.left = newX + "px";
            noBtn.style.top = newY + "px";
        }

        noBtn.addEventListener('click', () => {
            noCount++;
            speedMultiplier += 0.5; // Making it harder every click
            document.getElementById('no-msg').innerText = `Attempt ${noCount}: Nice try! But you can't say no! 😉`;
            moveNo();
        });

        // --- 3. RESPONSE HANDLING ---
        function sayYes() {
            document.getElementById('response-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
            
            const msg = `Hey ${proposalData.name}! I just clicked YES on your Valentine proposal! ❤️ (It took me ${noCount} tries to even catch the button!)`;
            document.getElementById('final-wa-btn').onclick = () => {
                window.open(`https://wa.me/${proposalData.phone}?text=${encodeURIComponent(msg)}`, '_blank');
            };
            
            // Final Ad after whole process
            setTimeout(showAd, 1000);
        }

        // --- 4. DATA LOADING ---
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const p = params.get('p');
            if(p) {
                proposalData = JSON.parse(atob(p));
                document.getElementById('creator-screen').classList.add('hidden');
                document.getElementById('response-screen').classList.remove('hidden');
                document.getElementById('v-title').innerText = `Hey ${proposalData.vName}, ${proposalData.name} is asking...`;
                // Set initial random position for No
                moveNo();
            }
        };

        // --- 5. ADS ---
        function showAd() {
            document.getElementById('ad-box').style.display = 'block';
        }
        function closeAd() {
            document.getElementById('ad-box').style.display = 'none';
        }
    </script>
</body>
</html>
